[workspace]
resolver = "2"
members = [
    "keel-core",
    "keel-book",
    "keel-pnl",
    "keel-guard",
    "keel-engine",
    "keel-data",
    "keel-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.100"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
